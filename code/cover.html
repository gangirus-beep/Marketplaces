<!doctype html><html lang="ru"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Manrope';src:url('fonts/Manrope.ttf');font-weight:200 800}
@font-face{font-family:'Unbounded';src:url('fonts/Unbounded.ttf');font-weight:200 900}
@font-face{font-family:'Montserrat';src:url('fonts/Montserrat.ttf');font-weight:100 900}
@font-face{font-family:'Marck Script';src:url('fonts/MarckScript.ttf')}
@font-face{font-family:'Bad Script';src:url('fonts/BadScript.ttf')}
@font-face{font-family:'Caveat';src:url('fonts/Caveat.ttf');font-weight:400 700}
@font-face{font-family:'Oswald';src:url('fonts/Oswald.ttf');font-weight:200 700}
@font-face{font-family:'Cormorant Garamond';src:url('fonts/Cormorant.ttf');font-weight:300 700}
html,body{margin:0;background:#fff}
#root{width:900px;height:1200px;box-sizing:border-box;padding:52px 56px 48px;display:flex;flex-direction:column;gap:22px;overflow:hidden;font-family:'Manrope',sans-serif;color:#1E1C1A;position:relative}
#deco{position:absolute;left:0;top:0;width:900px;height:1200px;z-index:0;overflow:hidden;pointer-events:none}
#root>*:not(#deco){position:relative;z-index:1}
#plaque{align-self:flex-start;display:flex;align-items:center;gap:24px;border-radius:28px;padding:20px 36px 24px 30px;color:#fff;box-shadow:0 12px 26px rgba(0,0,0,.22)}
#num{font-family:'Unbounded',sans-serif;font-weight:800;font-size:144px;line-height:.82;letter-spacing:-.04em}
#unit{font-family:'Montserrat',sans-serif;font-weight:800;font-size:40px;line-height:1;text-transform:uppercase;letter-spacing:0}
#line2{font-size:28px;font-weight:700;line-height:1.1}
#h{margin:0;white-space:nowrap}
#sub{font-size:30px;font-weight:600;color:#3A3632}
#zone{position:relative;flex:1 1 0;min-height:0}
#zone img{position:absolute}
#chips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.chip{display:flex;gap:14px;align-items:center;background:#fff;border-radius:16px;padding:16px 18px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.chip div{font-size:22px;font-weight:600;line-height:1.2}
.chip svg{flex-shrink:0}
</style></head><body>
<div id="root">
 <div id="deco"></div>
 <div id="plaque"><div id="num"></div><div style="display:flex;flex-direction:column;gap:5px"><div id="unit"></div><div id="line2"></div></div></div>
 <div style="display:flex;flex-direction:column;gap:6px"><h1 id="h"></h1><div id="sub"></div></div>
 <div id="zone"></div>
 <div id="chips"></div>
</div>
<script>
const svg=(w,h,body)=>'url("data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+body+'</svg>')+'")';
const INK='rgba(52,102,176,', RED='rgba(214,69,65,0.32)';
function hatchSvg(){ // цветная штриховка по углам
  const cl=[[700,40,'#F08A24'],[-30,330,'#2FA36B'],[640,560,'#2F6FD6'],[-20,840,'#E0559A'],[600,1010,'#E9B81E']]; let b='';
  cl.forEach((c,ci)=>{ for(let i=0;i<24;i++){ const j=((i*37+ci*11)%9)-4, x=c[0]+i*12, y=c[1]+j*3, len=150+((i*53+ci*7)%60);
    b+='<line x1="'+x+'" y1="'+(y+len)+'" x2="'+(x+len*0.52)+'" y2="'+y+'" stroke="'+c[2]+'" stroke-width="5" stroke-linecap="round" opacity="0.20"/>'; } });
  return svg(900,1200,b); }
const STROKES=svg(900,1200,[['M610 80 Q760 30 940 96','#F08A24'],['M-40 400 Q110 350 270 412','#1FA7A0'],['M690 650 Q820 600 950 660','#7A4FD0'],['M-30 905 Q150 850 330 915','#E0559A'],['M560 1140 Q740 1090 950 1150','#E9B81E']].map(p=>'<path d="'+p[0]+'" fill="none" stroke="'+p[1]+'" stroke-width="104" stroke-linecap="round" opacity="0.17"/><path d="'+p[0]+'" fill="none" stroke="'+p[1]+'" stroke-width="60" stroke-linecap="round" opacity="0.10" transform="translate(14,-10)"/>').join(''));
const SKETCH=svg(900,1200,'<g fill="none" stroke="#3C3E46" stroke-linecap="round" opacity="0.10" stroke-width="2.2"><circle cx="700" cy="250" r="190"/><ellipse cx="700" cy="250" rx="190" ry="62"/><path d="M510 250h380M700 60v380"/><path d="M-20 1010 L330 760 L560 1010 Z"/><path d="M330 760v250M60 1090l520 -30"/><path d="M40 620 q120 -70 240 0 t240 0"/></g>');
const WAVES=svg(300,92,'<path d="M0 46 C25 6 50 6 75 46 S125 86 150 46 S200 6 225 46 S275 86 300 46" fill="none" stroke="#2444B8" stroke-width="2.6" stroke-linecap="round" opacity="0.14"/>');
const HOLES=svg(56,60,'<circle cx="27" cy="30" r="9" fill="rgba(40,45,60,0.20)"/><circle cx="27" cy="30" r="9" fill="none" stroke="rgba(40,45,60,0.16)" stroke-width="1.5"/>');
const SPIRAL=svg(48,44,'<ellipse cx="24" cy="26" rx="7" ry="8" fill="rgba(40,45,60,0.20)"/><path d="M24 30 C12 30 12 2 24 2 S36 20 30 26" fill="none" stroke="rgba(60,65,80,0.34)" stroke-width="3" stroke-linecap="round"/>');
const PUNCH=svg(900,1200,'<g fill="rgba(40,45,55,0.24)" stroke="rgba(40,45,55,0.18)" stroke-width="2"><circle cx="29" cy="470" r="13"/><circle cx="29" cy="730" r="13"/></g>');
const KRAFT=svg(300,300,'<filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.36  0 0 0 0 0.26  0 0 0 0 0.12  0 0 0 0.42 0"/></filter><rect width="300" height="300" filter="url(#n)"/>');
const PLATE=svg(64,64,'<g fill="rgba(255,255,255,0.55)" stroke="rgba(60,65,75,0.20)" stroke-width="1.2"><rect x="6" y="12" width="26" height="8" rx="4" transform="rotate(45 19 16)"/><rect x="38" y="44" width="26" height="8" rx="4" transform="rotate(-45 51 48)"/></g>');
const BG={
 lined:{name:'линейка',css:'repeating-linear-gradient(180deg, transparent 0 44px, '+INK+'0.18) 44px 46px), #F7F5EF'},
 grid:{name:'клетка',css:'repeating-linear-gradient(0deg, '+INK+'0.16) 0 1.5px, transparent 1.5px 30px), repeating-linear-gradient(90deg, '+INK+'0.16) 0 1.5px, transparent 1.5px 30px), #F7F5EF'},
 oblique:{name:'косая линейка',css:'repeating-linear-gradient(115deg, transparent 0 96px, '+INK+'0.13) 96px 98px), repeating-linear-gradient(180deg, transparent 0 22px, '+INK+'0.18) 22px 24px, transparent 24px 46px, '+INK+'0.18) 46px 48px, transparent 48px 84px), #F7F5EF'},
 legal:{name:'жёлтый лист',css:'repeating-linear-gradient(180deg, transparent 0 44px, '+INK+'0.20) 44px 46px), #FBF3CF'},
 rings:{name:'лист на кольцах',css:HOLES+' 0 0/56px 60px repeat-y, repeating-linear-gradient(0deg, '+INK+'0.15) 0 1.5px, transparent 1.5px 30px), repeating-linear-gradient(90deg, '+INK+'0.15) 0 1.5px, transparent 1.5px 30px), #F7F5EF'},

 spiral:{name:'спираль сверху',css:SPIRAL+' 0 4px/48px 44px repeat-x, #F4F1EA'},
 sketch:{name:'эскиз',css:SKETCH+' 0 0/900px 1200px no-repeat, #F5F2EA'},
 waves:{name:'проба пера',css:WAVES+' 0 0/300px 92px, #F7F5F0'},
 form:{name:'бланк',css:'linear-gradient(#F7F5F0 0 56px, transparent 56px) 0 0/100% 58px, repeating-linear-gradient(90deg, rgba(36,68,184,0.30) 0 7px, transparent 7px 14px), #F7F5F0'},

};

// ---------- вторая серия фонов (05.10.2026): рисунок не заходит под заголовок, фон тетрадей = линовка товара
const CW={a:{n:'классика',paper:'#F7F5EF',line:'52,102,176'},b:{n:'крем',paper:'#F6EEDD',line:'120,95,70'},c:{n:'мята',paper:'#EAF4EC',line:'40,130,90'},d:{n:'небо',paper:'#E8F0F8',line:'40,90,170'}};
function ruled(kind,cw){ const c=CW[cw], L=a=>'rgba('+c.line+','+a+')'; let p;
  if(kind==='line') p='repeating-linear-gradient(180deg, transparent 0 44px, '+L(0.19)+' 44px 46px)';
  if(kind==='narrow') p='repeating-linear-gradient(180deg, transparent 0 30px, '+L(0.19)+' 30px 32px)';
  if(kind==='grid') p='repeating-linear-gradient(0deg, '+L(0.17)+' 0 1.5px, transparent 1.5px 30px), repeating-linear-gradient(90deg, '+L(0.17)+' 0 1.5px, transparent 1.5px 30px)';
  if(kind==='big') p='repeating-linear-gradient(0deg, '+L(0.18)+' 0 2px, transparent 2px 46px), repeating-linear-gradient(90deg, '+L(0.18)+' 0 2px, transparent 2px 46px)';
  if(kind==='oblique') p='repeating-linear-gradient(115deg, transparent 0 96px, '+L(0.13)+' 96px 98px), repeating-linear-gradient(180deg, transparent 0 22px, '+L(0.19)+' 22px 24px, transparent 24px 46px, '+L(0.19)+' 46px 48px, transparent 48px 84px)';
  return p+', '+c.paper; }
const KN={line:'линейка',narrow:'узкая линейка',grid:'клетка',big:'крупная клетка',oblique:'косая линейка'};
for(const k of Object.keys(KN)) for(const w of Object.keys(CW)) BG[k+'_'+w]={name:KN[k]+' · '+CW[w].n,css:ruled(k,w)};
const PC=['#E5393B','#F08A24','#F2C21A','#7BBF3A','#1FA36B','#19A7B8','#2F6FD6','#5B4FD0','#9A4FCF','#E0559A','#8A5A3C','#3C3E46'];
function geo(cols,a){ const S=[['c',770,70,26],['t',862,236,30],['z',30,372,0],['s',868,468,24],['c',26,640,20],['z',850,700,0],['t',34,930,26],['h',866,985,28],['c',120,392,16],['s',792,404,18],['t',112,832,22],['c',800,846,18],['z',380,1166,0],['s',640,150,16]]; let b='';
  S.forEach((q,i)=>{ const col=cols[i%cols.length], st='fill="none" stroke="'+col+'" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="'+a+'"', x=q[1], y=q[2], r=q[3];
    if(q[0]==='c') b+='<circle cx="'+x+'" cy="'+y+'" r="'+r+'" '+st+'/>';
    if(q[0]==='t') b+='<path d="M'+x+' '+(y-r)+' L'+(x+r)+' '+(y+r*0.8)+' L'+(x-r)+' '+(y+r*0.8)+' Z" '+st+' transform="rotate('+(i*23%40-20)+' '+x+' '+y+')"/>';
    if(q[0]==='s') b+='<rect x="'+(x-r)+'" y="'+(y-r)+'" width="'+2*r+'" height="'+2*r+'" rx="4" '+st+' transform="rotate('+(15+i*17%50)+' '+x+' '+y+')"/>';
    if(q[0]==='h') b+='<path d="M'+(x-r)+' '+y+' A'+r+' '+r+' 0 0 1 '+(x+r)+' '+y+'" '+st+'/>';
    if(q[0]==='z') b+='<path d="M'+x+' '+y+' l14 -16 l14 16 l14 -16 l14 16" '+st+'/>'; });
  return svg(900,1200,b); }
function halftone(col){ let b=''; for(let y=13;y<1200;y+=26) for(let x=13+((y/26|0)%2)*13;x<900;x+=26){ const d=Math.hypot(900-x,1200-y), r=8.5*(1-d/980); if(r>0.8) b+='<circle cx="'+x+'" cy="'+y+'" r="'+r.toFixed(1)+'"/>'; } return svg(900,1200,'<g fill="'+col+'" opacity="0.17">'+b+'</g>'); }
function confetti(){ let b='',i=0; for(let y=30;y<1200;y+=58) for(let x=30+((y/58|0)%2)*29;x<900;x+=58){ i++; if(y<350&&x<770) continue; b+='<circle cx="'+x+'" cy="'+y+'" r="6.5" fill="'+PC[(i*5)%10]+'" opacity="0.30"/>'; } return svg(900,1200,b); }
function arcs(){ let b=''; for(let i=0;i<7;i++) b+='<circle cx="900" cy="1200" r="'+(110+i*38)+'" fill="none" stroke="'+PC[i]+'" stroke-width="20" opacity="0.24"/>'; for(let i=0;i<4;i++) b+='<circle cx="900" cy="0" r="'+(50+i*34)+'" fill="none" stroke="'+PC[9-i]+'" stroke-width="18" opacity="0.22"/>'; return svg(900,1200,b); }
const TIPS=svg(900,1200,Array.from({length:15},(_,i)=>'<path d="M'+(i*60)+' 1200 L'+(i*60+30)+' 1156 L'+(i*60+60)+' 1200 Z" fill="'+PC[i%12]+'" opacity="0.85"/><path d="M'+(i*60+22)+' 1168 L'+(i*60+30)+' 1156 L'+(i*60+38)+' 1168 Z" fill="#2B2B30" opacity="0.75"/>').join(''));
const EDGE=svg(900,1200,PC.map((c,i)=>'<rect x="878" y="'+(i*100)+'" width="22" height="100" fill="'+c+'" opacity="0.88"/>').join(''));
const DABS=svg(900,1200,['#E5393B','#F08A24','#F2C21A','#1FA36B','#19A7B8','#2F6FD6','#9A4FCF'].map((c,i)=>'<ellipse cx="872" cy="'+(352+i*82)+'" rx="18" ry="16" fill="'+c+'" opacity="0.85" transform="rotate('+(i*37%50-25)+' 872 '+(352+i*82)+')"/><ellipse cx="866" cy="'+(346+i*82)+'" rx="5" ry="3" fill="#fff" opacity="0.45"/>').join(''));
const TABS=svg(900,1200,['#136F63','#F08A24','#F2C21A','#2F6FD6','#E5393B'].map((c,i)=>'<rect x="872" y="'+(318+i*112)+'" width="60" height="92" rx="12" fill="'+c+'" opacity="0.86"/>').join(''));
const STACK=svg(900,1200,Array.from({length:6},(_,i)=>'<rect x="'+(866+i*6)+'" y="0" width="1.6" height="1200" fill="rgba(60,70,90,'+(0.14+i*0.03)+')"/>').join('')+'<rect x="864" y="0" width="36" height="1200" fill="rgba(60,70,90,0.05)"/>');
const FLOUR=svg(900,1200,'<g fill="none" stroke="#2444B8" stroke-linecap="round" opacity="0.17"><path d="M560 150 C600 60 660 60 650 120 S590 190 640 150 S740 60 760 110 S720 180 790 130 S860 80 880 110" stroke-width="3.2"/><path d="M60 800 C140 690 220 690 200 770 S110 850 190 800 S330 690 350 760 S300 850 390 790 S520 700 540 770 S500 850 600 790 S760 720 850 760" stroke-width="3.6"/><path d="M90 860 Q400 900 820 838" stroke-width="2.4"/></g>');
const PLUS=svg(44,44,'<path d="M22 16v12M16 22h12" stroke="rgba(36,68,184,0.24)" stroke-width="2.2" stroke-linecap="round"/>');
const PLUSG=svg(44,44,'<path d="M22 16v12M16 22h12" stroke="rgba(70,75,90,0.22)" stroke-width="2.2" stroke-linecap="round"/>');
const ABC=['Аа Бб Вв Гг Дд Ее Жж Зз Ии Кк Лл','Мм Нн Оо Пп Рр Сс Тт Уу Фф Хх','Цц Чч Шш Щщ Ъъ Ыы Ьь Ээ Юю Яя'];
const PROPIS='<div style="position:absolute;left:0;top:384px;width:900px;font-family:\'Marck Script\',cursive;font-size:50px;line-height:84px;color:rgba(36,68,184,0.20);white-space:nowrap;padding-left:26px">'+Array.from({length:10},(_,i)=>'<div style="height:84px">'+ABC[i%3]+'</div>').join('')+'</div>';
Object.assign(BG,{
 propis:{name:'пропись',css:'linear-gradient(180deg, #F7F5EF 0 336px, rgba(247,245,239,0) 384px), repeating-linear-gradient(115deg, transparent 0 96px, '+INK+'0.10) 96px 98px), repeating-linear-gradient(180deg, transparent 0 22px, '+INK+'0.16) 22px 24px, transparent 24px 46px, '+INK+'0.16) 46px 48px, transparent 48px 84px) 0 384px, #F7F5EF',deco:PROPIS},
 flourish:{name:'росчерк',css:FLOUR+' 0 0/900px 1200px no-repeat, #F5F4F0'},
 plus:{name:'плюсы',css:PLUS+' 0 0/44px 44px, #F2F5FB'},
 plusg:{name:'плюсы серые',css:PLUSG+' 0 0/44px 44px, #F3F3F1'},
 geo:{name:'геометрия',css:geo(['#2F6FD6','#E5393B','#F2B81A','#19A7B8'],0.30)+' 0 0/900px 1200px no-repeat, #F4F5F8'},
 geow:{name:'геометрия тёплая',css:geo(['#D3401F','#F08A24','#8A5A3C','#E0559A'],0.28)+' 0 0/900px 1200px no-repeat, #F7F3EC'},
 diag:{name:'диагональ',css:'repeating-linear-gradient(135deg, rgba(31,95,191,0.055) 0 26px, transparent 26px 52px), #F1F5FB'},
 diagt:{name:'диагональ бирюзовая',css:'repeating-linear-gradient(135deg, rgba(19,111,99,0.06) 0 26px, transparent 26px 52px), #EEF4F2'},
 halftone:{name:'полутон',css:halftone('#1F5FBF')+' 0 0/900px 1200px no-repeat, #F3F5FA'},
 edge:{name:'цветная кромка',css:EDGE+' 0 0/900px 1200px no-repeat, #F6F3EC'},
 tips:{name:'носики карандашей',css:TIPS+' 0 0/900px 1200px no-repeat, #F6F3EC'},
 confetti:{name:'конфетти',css:confetti()+' 0 0/900px 1200px no-repeat, #F7F4EE'},
 arcs:{name:'радужные дуги',css:arcs()+' 0 0/900px 1200px no-repeat, #F6F3EC'},
 canvas:{name:'холст',css:'repeating-linear-gradient(0deg, rgba(120,100,70,0.11) 0 1px, transparent 1px 4px), repeating-linear-gradient(90deg, rgba(120,100,70,0.11) 0 1px, transparent 1px 4px), #F3EDE1'},
 dabs:{name:'капли краски',css:DABS+' 0 0/900px 1200px no-repeat, #F5F1EA'},
 papercool:{name:'акварель холодная',css:'radial-gradient(520px 420px at 100% 4%, rgba(90,170,240,0.30), transparent 70%), radial-gradient(560px 460px at 0% 40%, rgba(110,210,200,0.24), transparent 70%), radial-gradient(620px 480px at 100% 72%, rgba(150,140,245,0.24), transparent 70%), radial-gradient(520px 420px at 6% 100%, rgba(120,200,160,0.24), transparent 70%), #EFF2F1'},
 paperwarm:{name:'акварель тёплая',css:'radial-gradient(520px 420px at 100% 4%, rgba(255,150,90,0.30), transparent 70%), radial-gradient(560px 460px at 0% 40%, rgba(250,200,90,0.26), transparent 70%), radial-gradient(620px 480px at 100% 72%, rgba(240,120,150,0.24), transparent 70%), radial-gradient(520px 420px at 6% 100%, rgba(255,170,120,0.24), transparent 70%), #F6F0E6'},
 tabs:{name:'закладки-разделители',css:TABS+' 0 0/900px 1200px no-repeat, #F2F3F5'},
 greygrid:{name:'серая клетка',css:'repeating-linear-gradient(0deg, rgba(70,80,95,0.10) 0 1.5px, transparent 1.5px 30px), repeating-linear-gradient(90deg, rgba(70,80,95,0.10) 0 1.5px, transparent 1.5px 30px), #F1F2F4'},
 stack:{name:'стопка листов',css:STACK+' 0 0/900px 1200px no-repeat, #F3F3F1'}
});

const FONT={grotesk:{family:"'Manrope', sans-serif",weight:800,k:0.62,max:72,extra:'line-height:1;letter-spacing:-0.02em'},

function shade(hex,m){const n=parseInt(hex.slice(1),16);return 'rgb('+Math.round(((n>>16)&255)*m)+','+Math.round(((n>>8)&255)*m)+','+Math.round((n&255)*m)+')'}
async function render(d){
  const $=id=>document.getElementById(id), q=d.qty, f=d.forms.split('|'), n10=q%10, n100=q%100;
  const unit=(n10===1&&n100!==11)?f[0]:(n10>=2&&n10<=4&&(n100<12||n100>14))?f[1]:f[2];
  const root=$('root'), b=BG[d.bg]||BG.plain; root.style.background=b.css; $('deco').innerHTML=b.deco||'';
  $('plaque').style.background=d.accent; $('plaque').style.display='flex'; $('num').textContent=q; $('unit').textContent=unit;
  $('line2').textContent=d.line2||''; $('line2').style.display=d.line2?'block':'none';
  let ft=FONT[d.font]; const fit=o=>Math.min(o.max,Math.floor(776/(Math.max(8,d.heading.length)*o.k)));
  if(fit(ft)<56) ft=FONT.compact; const size=Math.max(44,fit(ft));
  $('h').style.cssText='margin:0;white-space:nowrap;font-family:'+ft.family+';font-weight:'+ft.weight+';font-size:'+size+'px;'+ft.extra;
  $('h').textContent=d.heading; $('sub').textContent=d.sub;
  $('sub').style.cssText='white-space:nowrap;font-size:30px'; await document.fonts.load('600 30px Manrope'); let ss=30; while($('sub').scrollWidth>788 && ss>22){ ss-=1; $('sub').style.fontSize=ss+'px'; }
  await document.fonts.load(ft.weight+' '+size+'px '+ft.family.split(',')[0]); let hs=size; while($('h').scrollWidth>788 && hs>36){ hs-=2; $('h').style.fontSize=hs+'px'; }
  $('chips').innerHTML=d.chips.map(t=>'<div class="chip"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="'+d.accent+'" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><div></div></div>').join('');
  [...document.querySelectorAll('.chip div')].forEach((e,i)=>e.textContent=d.chips[i]);
  const zone=$('zone'); zone.innerHTML=''; const panel=d.tone==='panel', white=d.tone==='white';
  zone.style.cssText='position:relative;flex:1 1 0;min-height:0'+(panel?';border-radius:28px;overflow:hidden;background:linear-gradient(155deg,'+d.accent+' 0%,'+shade(d.accent,0.62)+' 100%)':(white?';border-radius:28px;background:#FFFFFF':''));
  await document.fonts.ready;
  const zr=zone.getBoundingClientRect(), P=panel?28:0, W=zr.width-2*P, H=zr.height-2*P, R=d.ratio, sr=panel?18:26;
  // 13.10.2026: one supplier unit on every cover; sold quantity is in the plaque.
  const w=Math.floor(Math.min(W,(H-sr)*R)),h=Math.round(w/R),mode='single';
  const x0=P+Math.round((W-w)/2),y0=P+Math.max(0,Math.round((H-sr-h)/2));
  const im=new Image();im.src=d.img;
  const sc=panel?'0,0,0':'30,25,20';
  im.style.cssText='top:'+y0+'px;left:'+x0+'px;width:'+w+'px;height:'+h+'px;filter:drop-shadow(0 16px 20px rgba('+sc+','+(panel?'0.45':'0.30')+'))';
  zone.appendChild(im);await im.decode();
  return {copies:1,shownSupplierUnits:1,subsize:ss,subw:$('sub').scrollWidth,chipsH:Math.round($('chips').getBoundingClientRect().height),zoneH:Math.round(zr.height),w:w,h:h,mode:mode,hsize:hs,font:ft===FONT.compact?'compact':d.font,size:size,hw:Math.round($('h').getBoundingClientRect().width),overflow:root.scrollHeight>1200};
}
